# Render 一键部署配置
# 你的应用同时包含前端和后端，只需要部署一个服务

services:
  - type: web
    name: ai-resume-assistant
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: PORT
        value: "10000"
      - key: LLM_API_KEY
        sync: false  # 在 Render 控制台配置 DeepSeek API Key
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat