# Render 一键部署配置（FastAPI 版）
# 后端：FastAPI + Agent Workflow + RAG + LLM Provider

services:
  - type: web
    name: ai-resume-assistant
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "10000"
      # LLM Provider 选择：deepseek（默认）/ openai / coze
      - key: LLM_PROVIDER
        value: deepseek
      # DeepSeek（OpenAI 兼容接口）
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: MODEL_NAME
        value: deepseek-chat
      # OpenAI（可选 Provider）
      - key: OPENAI_API_KEY
        sync: false
      # Coze（备用 Provider）
      - key: COZE_API_KEY
        sync: false
      - key: COZE_BOT_ID
        sync: false